<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ş Sepeti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700&display=swap">
<style>
:root {
  /* Düzen: ortalanmış tek sütun. Üstte başlık, ardından durum şeridi, ortasında sepet olan kare tahta, altta düğme. */
  --bg: #e6f3f1;
  --board: #f4fbfa;
  --board-edge: #b8d8d3;
  --ink: #12363a;
  --muted: #46686b;
  --card: #ffffff;
  --card-edge: #a9cbc6;
  --accent: #d6336c;
  --on-accent: #ffffff;
  --ok: #1f9d55;
  --ok-ink: #146a3a;
  --bad: #d64545;
  --bad-ink: #b02a2a;
  --focus: #2563eb;
  --chip: #ffffff;
  --font-display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e2326;
    --board: #153136;
    --board-edge: #2f5b61;
    --ink: #e3f4f2;
    --muted: #9bbfbc;
    --card-edge: #6ea6a1;
    --accent: #ff6b9a;
    --on-accent: #3a0a1c;
    --ok: #3ddc84;
    --ok-ink: #6df0a5;
    --bad: #ff7676;
    --bad-ink: #ff9d9d;
    --focus: #7aa7ff;
    --chip: #17383d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e2326;
  --board: #153136;
  --board-edge: #2f5b61;
  --ink: #e3f4f2;
  --muted: #9bbfbc;
  --card-edge: #6ea6a1;
  --accent: #ff6b9a;
  --on-accent: #3a0a1c;
  --ok: #3ddc84;
  --ok-ink: #6df0a5;
  --bad: #ff7676;
  --bad-ink: #ff9d9d;
  --focus: #7aa7ff;
  --chip: #17383d;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap {
  max-width: 740px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
header {
  display: flex;
  align-items: center;
  gap: 16px;
}
.letter {
  flex: none;
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  background: var(--accent);
  color: var(--on-accent);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 46px;
  line-height: 1;
  padding-bottom: 4px;
}
header > div { min-width: 0; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(28px, 6vw, 40px);
  line-height: 1.1;
  text-wrap: balance;
}
header p {
  margin: 4px 0 0;
  font-size: 17px;
  color: var(--muted);
  text-wrap: balance;
}
.strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 18px;
  background: var(--chip);
  border: 2px solid var(--board-edge);
  border-radius: 16px;
  padding: 10px 16px;
}
.dots { display: flex; gap: 6px; flex: none; }
.dot {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 3px solid var(--accent);
  color: var(--accent);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  line-height: 1;
  padding-bottom: 1px;
  transition: background-color .25s, color .25s;
}
.dot.on { background: var(--accent); color: var(--on-accent); }
#status {
  flex: 1;
  min-width: 200px;
  min-height: 2.9em;
  display: flex;
  align-items: center;
  margin: 0;
  font-weight: 700;
  font-size: 17px;
}
#status[data-tone="good"] { color: var(--ok-ink); }
#status[data-tone="bad"] { color: var(--bad-ink); }

#board {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.board-bg { fill: var(--board); stroke: var(--board-edge); stroke-width: 4; }
.zone {
  fill: none;
  stroke: var(--accent);
  stroke-width: 4;
  stroke-dasharray: 3 15;
  stroke-linecap: round;
  opacity: .45;
  transition: opacity .15s;
}
.zone.hot { opacity: 1; stroke-dasharray: none; stroke-width: 6; }
.basket-in { transform-box: fill-box; transform-origin: 50% 80%; }
.basket-in.bounce { animation: bounce .45s ease-out; }
.win .basket-in { animation: wiggle 1.1s ease-in-out 2; }
@keyframes bounce { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
.basket-badge { font-family: var(--font-display); font-weight: 800; font-size: 50px; fill: var(--accent); }

.link { fill: none; stroke-width: 11; stroke-linecap: round; opacity: .9; transition: opacity .4s; }
.link.live { stroke: var(--accent); }
.link.ok { stroke: var(--ok); opacity: 1; }
.link.bad { stroke: var(--bad); }
.link.gone { opacity: 0; }

.card { cursor: grab; outline: none; }
.card.done { cursor: default; }
.card-shadow { fill: var(--card-edge); opacity: .55; }
.card-bg { fill: var(--card); stroke: var(--card-edge); stroke-width: 3; transition: stroke .2s; }
.card.done .card-bg { stroke: var(--ok); stroke-width: 7; }
.card:focus-visible .card-bg { stroke: var(--focus); stroke-width: 7; }
.badge { opacity: 0; transition: opacity .25s; }
.card.done .badge { opacity: 1; }
.card.shake { animation: shake .45s ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-9px); }
  40% { transform: translateX(9px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}

.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
button {
  font: inherit;
  font-weight: 800;
  font-size: 16px;
  padding: 11px 22px;
  border-radius: 999px;
  border: 3px solid var(--accent);
  cursor: pointer;
}
#reset { background: var(--accent); color: var(--on-accent); }
button:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .basket-in.bounce, .win .basket-in, .card.shake { animation: none; }
  .link, .dot, .zone, .badge { transition: none; }
}
@media (max-width: 480px) {
  .letter { width: 56px; height: 56px; font-size: 38px; border-radius: 16px; }
  header p { font-size: 15px; }
  #status { font-size: 15px; }
}
</style>

      '<rect class="card-bg" x="-80" y="-80" width="160" height="160" rx="24"/>' +
      '<g class="art" transform="scale(1.3)">' + ART[c.id] + '</g>' +
      '<g class="badge" transform="translate(64 -62)"><circle r="19" fill="var(--ok)"/><path d="M-8,0 L-2,7 L9,-6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>' +
      '</g>';
    cardsLayer.appendChild(g);
    c.el = g.firstChild;
    c.done = false;
    byId[c.id] = c;
  });

  function updateDots() {
    var nodes = dotsEl.children;
    for (var k = 0; k < nodes.length; k++) nodes[k].classList.toggle('on', k < found);
  }

  /* Koordinat ve çizgi yardımcıları */
  function toSvg(e) {
    var p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    var m = svg.getScreenCTM();
    return m ? p.matrixTransform(m.inverse()) : { x: 0, y: 0 };
  }
  function overBasket(p) {
    var dx = (p.x - BASKET.x) / 135, dy = (p.y - (BASKET.y + 5)) / 110;
    return dx * dx + dy * dy <= 1;
  }
  function snap(c) {
    var dx = c.x - BASKET.x, dy = c.y - BASKET.y;
    var dist = Math.hypot(dx, dy) || 1;
    return { x: BASKET.x + dx / dist * 110, y: BASKET.y + dy / dist * 55 };
  }
  function newLine(c) {
    var l = document.createElementNS(NS, 'line');
    l.setAttribute('class', 'link live');
    l.setAttribute('x1', c.x); l.setAttribute('y1', c.y);
    l.setAttribute('x2', c.x); l.setAttribute('y2', c.y);
    linksLayer.appendChild(l);
    return l;
  }
  function setEnd(l, p) { l.setAttribute('x2', p.x); l.setAttribute('y2', p.y); }
  function fadeOut(l, wait) {
    setTimeout(function () {
      l.classList.add('gone');
      setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 450);
    }, wait);
  }
  function bounce() {
    basketEl.classList.remove('bounce');
    void basketEl.getBoundingClientRect();
    basketEl.classList.add('bounce');
  }

  function resolve(c, line) {
    setEnd(line, snap(c));
    if (c.ok) {
      line.setAttribute('class', 'link ok');
      c.done = true;
      c.el.classList.add('done');
      found++;
      updateDots();
      bounce();
      if (found === TOTAL) {
        svg.classList.add('win');
        say('Tebrikler! Ş ile biten ' + TOTAL + ' resmin hepsi sepette.', 'good');
      } else {
        say('Doğru! ' + cap(c.label) + ' Ş ile biter.', 'good');
      }
    } else {
      line.setAttribute('class', 'link bad');
      c.el.classList.remove('shake');
      void c.el.getBoundingClientRect();
      c.el.classList.add('shake');
      say(cap(c.label) + ' Ş ile bitmez. Başka bir resim dene.', 'bad');
      fadeOut(line, 800);
    }
  }

  /* Sürükleyerek çizgi çekme */
  svg.addEventListener('pointerdown', function (e) {
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el || drag) return;
    var c = byId[el.getAttribute('data-id')];
    if (!c || c.done) return;
    e.preventDefault();
    drag = { c: c, line: newLine(c), id: e.pointerId, moved: false };
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  });
  svg.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var p = toSvg(e);
    setEnd(drag.line, p);
    zone.classList.toggle('hot', overBasket(p));
    if (Math.hypot(p.x - drag.c.x, p.y - drag.c.y) > 20) drag.moved = true;
  });
  function finish(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    var dr = drag;
    drag = null;
    zone.classList.remove('hot');
    try { svg.releasePointerCapture(e.pointerId); } catch (err) {}
    var p = toSvg(e);
    if (!cancelled && dr.moved && overBasket(p)) {
      resolve(dr.c, dr.line);
    } else {
      if (dr.line.parentNode) dr.line.parentNode.removeChild(dr.line);
      if (!cancelled) {
        say(START_MSG, 'hint');
      }
    }
  }
  svg.addEventListener('pointerup', function (e) { finish(e, false); });
  svg.addEventListener('pointercancel', function (e) { finish(e, true); });

  /* Klavye: Enter veya Boşluk ile resmi sepete ulaştır */
  cardsLayer.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el) return;
    e.preventDefault();
    var c = byId[el.getAttribute('data-id')];
    if (!c || c.done) return;
    resolve(c, newLine(c));
  });

  resetBtn.addEventListener('click', function () {
    while (linksLayer.firstChild) linksLayer.removeChild(linksLayer.firstChild);
    CARDS.forEach(function (c) { c.done = false; c.el.classList.remove('done', 'shake'); });
    found = 0;
    svg.classList.remove('win');
    updateDots();
    say(START_MSG, 'hint');
  });

  updateDots();
  say(START_MSG, 'hint');
})();
</script>

</body></html>
